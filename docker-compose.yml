services:

  postgres:
    image: postgres:16-alpine
    container_name: standknife_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: standknife
      POSTGRES_USER: standknife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standknife_dev}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standknife -d standknife"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: standknife_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: standknife_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://standknife:${POSTGRES_PASSWORD:-standknife_dev}@postgres:5432/standknife
      REDIS_URL: redis://redis:6379/0
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile

    container_name: standknife_bot
    restart: unless-stopped

    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL}

    depends_on:
      backend:
        condition: service_started


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: standknife_frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_started


volumes:
  postgres_data:
  redis_data:
